<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Eventos e Notificações (Firebase)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .cadastro-header { background-color: #198754; color: white; padding: 20px 0; margin-bottom: 30px; }
        .form-container { 
            background-color: white; 
            padding: 30px; 
            border-radius: .5rem; 
            box-shadow: 0 0.5rem 1rem rgba(0,0,0,.1); 
        }
        .section-title { margin-top: 20px; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 20px; color: #198754; font-weight: bold; }
        .checkbox-group { background: #f1f3f5; padding: 15px; border-radius: 8px; border: 1px solid #dee2e6; }
    </style>
</head>
<body>

    <header class="cadastro-header">
        <div class="container">
            <h1 class="text-center">Notificação de Eventos e Ocorrências</h1>
            <p class="text-center">Registro seguro de incidentes e fluxos administrativos</p>
            <div class="text-center mt-3">
                <a href="index.html" class="btn btn-sm btn-light">&larr; Voltar à Página Inicial</a>
            </div>
        </div>
    </header>

    <main class="container mb-5">
        <div id="statusMessage" class="alert text-center" role="alert" style="display:none;"></div>

        <div class="form-container">
            <form id="cadastroForm">
                
                <h4 class="section-title">1. Identificação do Notificante:</h4>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Email:</label>
                        <input type="email" class="form-control" name="email_notificante" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Nome do notificante:</label>
                        <input type="text" class="form-control" name="nome_notificante" placeholder="NOME COMPLETO" required>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Local de ocorrência:</label>
                        <select class="form-select" name="local_ocorrencia" required>
                            <option value="">Selecione a unidade...</option>
                            <optgroup label="Unidades com histórico no banco">
                                <option value="M'Boi Mirim">M'Boi Mirim</option>
                                <option value="Hospital Arnaldo de Figueiredo Freitas">Hospital Arnaldo de Figueiredo Freitas</option>
                                <option value="PREVENT/Cincinato">PREVENT/Cincinato</option>
                                <option value="HGG - Treinamento">HGG - Treinamento</option>
                                <option value="PREVENT/Santana">PREVENT/Santana</option>
                                <option value="HGG">HGG</option>
                                <option value="PREVENT/Londres">PREVENT/Londres</option>
                                <option value="PREVENT/Penha">PREVENT/Penha</option>
                                <option value="PREVENT/Bela Vista">PREVENT/Bela Vista</option>
                                <option value="PREVENT/Alemanha">PREVENT/Alemanha</option>
                                <option value="PREVENT/Ibirapuera">PREVENT/Ibirapuera</option>
                                <option value="PREVENT/Jardim São Paulo">PREVENT/Jardim São Paulo</option>
                                <option value="PREVENT/Barcelona">PREVENT/Barcelona</option>
                                <option value="PREVENT/Coelho Lisboa">PREVENT/Coelho Lisboa</option>
                                <option value="Plena Saúde">Plena Saúde</option>
                                <option value="PREVENT/Madrid">PREVENT/Madrid</option>
                                <option value="Hospital Presidente/Prevent">Hospital Presidente/Prevent</option>
                                <option value="Hospital Salvalus">Hospital Salvalus</option>
                            </optgroup>
                            <optgroup label="Outras unidades">
                                <option value="Setor Performa">Setor Performa</option>
                                <option value="PS Santa Maggiori Santana">PS Santa Maggiori Santana</option>
                                <option value="PS Santa Maggiori Tatuapé">PS Santa Maggiori Tatuapé</option>
                                <option value="Hospital Cruz Azul">Hospital Cruz Azul</option>
                                <option value="PREVENT/UTI">PREVENT/UTI</option>
                                <option value="M'Boi Mirim - Treinamento">M'Boi Mirim - Treinamento</option>
                                <option value="PREVENT/SBC">PREVENT/SBC</option>
                                <option value="PREVENT/Santo André">PREVENT/Santo André</option>
                                <option value="Rota dos Bandeirantes">Rota dos Bandeirantes</option>
                                <option value="Hospital Geral de Grajaú">Hospital Geral de Grajaú</option>
                                <option value="Hospital Rosário">Hospital Rosário</option>
                                <option value="Hospital Caieiras">Hospital Caieiras</option>
                                <option value="Hospital HIABC">Hospital HIABC</option>
                                <option value="HSL Osasco">HSL Osasco</option>
                            </optgroup>
                            <option value="Outro">Outro (especificar na descrição)</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Data da ocorrência:</label>
                        <input type="date" class="form-control" name="data_ocorrencia" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Dia da semana:</label>
                        <input type="text" class="form-control" id="diaSemanaDisplay" placeholder="(preenchido pela data)" readonly>
                        <div class="form-text">Calculado automaticamente a partir da data.</div>
                    </div>
                </div>

                <h4 class="section-title">2. Notificação:</h4>
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label class="form-label d-block">A quem deseja notificar? (Múltipla Escolha):</label>
                        <div class="checkbox-group">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="notificar_quem" value="MÉDICO GENERALISTA" id="check1">
                                <label class="form-check-label" for="check1">Médico Generalista</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="notificar_quem" value="INSTITUIÇÃO" id="check2">
                                <label class="form-check-label" for="check2">Instituição (Eventos com equipes da unidade)</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="notificar_quem" value="MÉDICO ESPECIALISTA" id="check3">
                                <label class="form-check-label" for="check3">Médico Especialista</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="notificar_quem" value="PROFISSIONAL EM TREINAMENTO" id="check4">
                                <label class="form-check-label" for="check4">Profissional em Treinamento</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" name="notificar_quem" value="OUTRO" id="check5">
                                <label class="form-check-label" for="check5">Outro</label>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Nome do notificado / Setor:</label>
                        <input type="text" class="form-control" name="nome_notificado_setor" placeholder="Digite o nome ou setor" required>
                    </div>
                </div>

                <h4 class="section-title">3. Detalhes do Evento:</h4>
                <div class="row mb-3">
                    <div class="col-md-12">
                        <label class="form-label">Tipo de evento:</label>
                        <select class="form-select" name="tipo_evento" required>
                            <option value="">Selecione o tipo de evento...</option>
                            <option value="ASSISTENCIAL">Assistencial (Relacionado ao paciente - informar prontuário)</option>
                            <option value="ADMINISTRATIVO - FALTA">Administrativo - Falta</option>
                            <option value="ADMINISTRATIVO - ATRASOS">Administrativo - Atrasos</option>
                            <option value="COMPORTAMENTAL">Comportamental (Ética, Acolhimento, Empatia etc)</option>
                            <option value="AUSENCIA DE EVOLUÇÃO">Ausência de evolução ou evolução incompleta</option>
                            <option value="PROBLEMAS TI">Falta de sistema, problemas com rede, senha de acesso</option>
                            <option value="FALHA TROCA PLANTÃO">Não cumprimento da rotina de troca de plantão</option>
                            <option value="FALTA MATERIAL/EQUIP">Falta de material, equipamento ou profissionais insuficiente</option>
                            <option value="INTERCORRÊNCIA UNIDADE">Comunicado de intercorrência relacionada a paciente</option>
                            <option value="NÃO PASSOU PLANTÃO">Não passou plantão</option>
                            <option value="FALHA PROTOCOLO INSTITUCIONAL">Não realizou protocolo institucional adequadamente</option>
                            <option value="NÃO REALIZOU INTEGRAÇÃO">Não realizou Integração</option>
                            <option value="DESCUMPRIMENTO PROTOCOLO INST">Não cumprimento do protocolo pela instituição</option>
                            <option value="BAIXO ATENDIMENTO">Número atendimento abaixo da meta por hora</option>
                            <option value="PROFISSIONAIS INSUFICIENTE">Número de profissionais insuficiente</option>
                            <option value="FALHA LME">Não realização ou incompleto preenchimento LME (Alto Custo)</option>
                            <option value="RECEITA INCOMPLETA">Fornecimento de receita incompleto</option>
                            <option value="NEGATIVA RECEITA">Negativa de receita não conforme</option>
                            <option value="ROTINA ERRADA RECEPÇÃO">Rotina errada orientada/realizada pela recepção</option>
                            <option value="AGENDAMENTO ERRADO">Administrativo (Agendamento de especialidade errada)</option>
                            <option value="ABANDONO PLANTÃO">Abandono de plantão antes do término</option>
                            <option value="EXAME ERRADO">Solicitação de exame errado/incompleto</option>
                            <option value="NÃO REAVALIOU EXAMES">Não reavaliação dos exames</option>
                            <option value="CANCELAMENTO AGENDA">Administrativo (Relacionado a Cancelamento de agenda)</option>
                            <option value="NÃO REALIZOU CHECK-IN">Não realizou Check-in (entrada)</option>
                            <option value="NÃO REALIZOU CHECK-OUT">Não realizou Check-out (saída)</option>
                            <option value="FALHA CHECK-IN/OUT">Não realizou Check-in e Check-out</option>
                            <option value="AUSENCIA EM AULA">Ausência de participação em aula</option>
                            <option value="TRIAGEM NÃO CONFORME">Triagem não conforme</option>
                            <option value="OUTRO">Outro (especificar abaixo)</option>
                        </select>
                    </div>
                </div>

                <div class="row mb-3">
                    <div class="col-md-12 mb-3">
                        <label class="form-label">Descrição do evento:</label>
                        <textarea class="form-control" name="descricao_evento" rows="3" placeholder="Descreva os detalhes..." required></textarea>
                    </div>
                    <div class="col-md-12 mb-3">
                        <label class="form-label">Foram feitas ações imediatas?</label>
                        <textarea class="form-control" name="acoes_imediatas" rows="2" placeholder="Quais medidas foram tomadas na hora?"></textarea>
                    </div>
                    <div class="col-md-12 mb-3">
                        <label class="form-label">Implicações?</label>
                        <textarea class="form-control" name="implicacoes" rows="2" placeholder="Quais as consequências deste evento?"></textarea>
                    </div>
                </div>

                <button type="submit" class="btn btn-success btn-lg w-100" id="saveButton">
                    Enviar Notificação / Salvar no Banco
                </button>

            </form>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // CONFIGURAÇÃO ATUALIZADA PARA O PROJETO gestaoeventos-a5ddf
        const firebaseConfig = {
            apiKey: "AIzaSyBwqk2Yf2xCA1IrNRv5AgYCPU-6CSt1FTs",
            authDomain: "gestaoeventos-a5ddf.firebaseapp.com",
            projectId: "gestaoeventos-a5ddf",
            storageBucket: "gestaoeventos-a5ddf.firebasestorage.app",
            messagingSenderId: "963856052375",
            appId: "1:963856052375:web:bed2c8c06e4b7b71a2f9d2",
            measurementId: "G-261ZTL5FEE"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        // COLEÇÃO ATUALIZADA CONFORME IMAGEM DO BANCO DE DADOS
        const COLECAO = 'eventos_notificacoes'; 

        const NOMES_DIAS = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];

        // "2026-06-15" -> "15/06/2026" (padroniza no mesmo formato dos registros existentes)
        function dataISOparaBR(iso) {
            if (!iso || !/^\d{4}-\d{2}-\d{2}/.test(iso)) return iso || '';
            const [y, m, d] = iso.split('-');
            return `${d}/${m}/${y}`;
        }
        // Dia da semana a partir de "2026-06-15" (construtor local evita erro de fuso)
        function diaSemanaDaData(iso) {
            if (!iso || !/^\d{4}-\d{2}-\d{2}/.test(iso)) return '';
            const [y, m, d] = iso.split('-').map(Number);
            const dt = new Date(y, m - 1, d);
            return isNaN(dt) ? '' : NOMES_DIAS[dt.getDay()];
        }

        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('cadastroForm');
            const statusMessage = document.getElementById('statusMessage');
            const dateInput = form.querySelector('[name="data_ocorrencia"]');
            const diaDisplay = document.getElementById('diaSemanaDisplay');

            // Preenche o dia da semana automaticamente quando a data muda
            dateInput.addEventListener('change', () => {
                diaDisplay.value = diaSemanaDaData(dateInput.value);
            });

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                const btnSalvar = document.getElementById('saveButton');
                btnSalvar.disabled = true;

                const formData = new FormData(form);
                const dataToSave = {};
                
                const notificadosArray = [];
                document.querySelectorAll('input[name="notificar_quem"]:checked').forEach((checkbox) => {
                    notificadosArray.push(checkbox.value);
                });

                formData.forEach((value, key) => {
                    if (key === 'notificar_quem') return;
                    let v = String(value).trim();
                    if (key === 'data_ocorrencia') { dataToSave[key] = dataISOparaBR(v); return; }
                    if (key === 'email_notificante') { dataToSave[key] = v.toLowerCase(); return; }
                    // Demais campos: preserva o texto como digitado (sem forçar maiúsculas)
                    dataToSave[key] = v;
                });

                // Dia da semana derivado da data (sempre consistente com data_ocorrencia)
                dataToSave["dia_semana"] = diaSemanaDaData(dateInput.value);
                dataToSave["notificados"] = notificadosArray;
                dataToSave["carimbo_data_hora"] = new Date().toISOString();
                dataToSave["status_processamento"] = "PENDENTE";

                statusMessage.style.display = 'block';
                statusMessage.className = 'alert alert-info';
                statusMessage.textContent = 'Enviando notificação para o sistema...';

                try {
                    const docRef = await addDoc(collection(db, COLECAO), dataToSave);
                    statusMessage.className = 'alert alert-success';
                    statusMessage.textContent = `Sucesso! Notificação registrada com sucesso. ID: ${docRef.id}`;
                    form.reset();
                    diaDisplay.value = '';
                    window.scrollTo(0, 0);

                } catch (error) {
                    statusMessage.className = 'alert alert-danger';
                    statusMessage.textContent = `Erro técnico ao salvar: ${error.message}`; 
                } finally {
                    btnSalvar.disabled = false;
                }
            });
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
